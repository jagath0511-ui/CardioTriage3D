services:
  - type: web
    name: cardiotriage-3d
    runtime: python
    repo: https://github.com/jagath0511-ui/CardioTriage3D
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
